        <section>
            <article>

                <table>
                    <tr>
                        <td>
                            <aside>
                                <p>

                            <img src="IMG/divider cereja.webp" alt="divider" width="500">
                            <h2>(voce precisa se <mark>cadastrar</mark> para acessar o conteudo)</h2>
                            <br>
                            <br>
                            
                            <form action="HTML/home.html" method="get">
                                <label for="nome">Nome:</label>
                                <input type="text" id="nome" name="nome" placeholder="coloque seu nome aqui"
                                    required><br><br>

                                <label for="email">Email:</label>
                                <input type="email" id="email" name="email" placeholder="coloque seu email aqui"
                                    required><br><br>

                                <label for="senha">Senha:</label>
                                <input type="password" id="senha" name="senha" placeholder="coloque sua senha aqui"
                                    required><br><br>

                                <label for="cor">sua cor favorita</label>
                                <input type="color" id="cor" name="cor" required><br><br>

                                <label for="data"> sua data de aniverasario</label>
                                <input type="date" id="data" name="data" required><br><br>

                                <label for="range"> o quanto voce gosta de bolo?</label>
                                <input type="range" id="range" name="range" required><br><br>
                                <label for="bolo">Bolo favorito:</label>

                                <input list="bolos" id="bolo" name="bolo" placeholder="Escolha ou digite um sabor"
                                    required>

                                <datalist id="bolos">
                                    <option value="Chocolate">
                                    <option value="Morango">
                                    <option value="Cenoura">
                                    <option value="Red Velvet">
                                    <option value="Baunilha">
                                </datalist><br><br>

                                <br>
                                <input type="submit" value="Cadastrar">
                            </form>
